name: Benchmark and Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,qlora]"

      - name: Run ruff linter
        run: ruff check .

      # Trained weights are ~1 GB and are deliberately not committed (see
      # .gitignore and the README "Notes" section). Detect them so the
      # artifact-dependent steps can skip instead of failing on a clean
      # checkout. `make test` is the 80% coverage gate; it needs these weights,
      # so CI reports coverage without gating.
      - name: Detect trained artifacts
        id: artifacts
        shell: bash
        run: |
          if [ -f slm-training/best_model.pt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "slm-training/best_model.pt not found; skipping artifact-dependent steps."
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v -m "not slow" --cov=. --cov-report=xml

      - name: Run slow checkpoint tests
        if: steps.artifacts.outputs.present == 'true'
        run: |
          python -m pytest tests/test_model_and_api.py -v -m slow --cov=. --cov-report=xml

      - name: Run setup verification
        # Runs unconditionally: a clean checkout must pass, reporting the
        # gitignored 1 GB checkpoint as a warning rather than an error.
        run: python verify_setup.py

      - name: Run live comparison
        if: steps.artifacts.outputs.present == 'true'
        run: python run_all.py

      - name: Security scan
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: py${{ matrix.python-version }}-coverage
          fail_ci_if_error: false

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-artifacts-py${{ matrix.python-version }}
          path: |
            slm-comparison/comparison_samples.json
            slm-comparison/comparison_samples.md
            benchmarks/slm_live_results.json
            benchmarks/qwen_base_results.json
            benchmarks/slm_forward_bench.json
            benchmarks/qwen_forward_bench.json
            benchmarks/benchmark_report.md
            benchmarks/test_split_eval.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Generate provenance manifest
        run: python scripts/generate_provenance.py --output provenance.json

      - name: Upload provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: provenance-py${{ matrix.python-version }}
          path: provenance.json
          retention-days: 30
