name: Benchmark and Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,qlora]"

      - name: Run ruff linter
        run: ruff check .

      - name: Run mypy type checker
        run: mypy .

      # Trained weights are ~1 GB and are deliberately not committed (see
      # .gitignore and the README "Notes" section). Detect them so the
      # artifact-dependent steps can skip instead of failing on a clean
      # checkout. `make test` is the 80% coverage gate; it needs these weights,
      # so CI reports coverage without gating.
      - name: Detect trained artifacts
        id: artifacts
        shell: bash
        run: |
          if [ -f slm-training/best_model.pt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "slm-training/best_model.pt not found; skipping artifact-dependent steps."
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v -m "not slow" --cov=. --cov-report=xml

      - name: Run slow checkpoint tests
        if: steps.artifacts.outputs.present == 'true'
        run: |
          python -m pytest tests/test_model_and_api.py -v -m slow --cov=. --cov-report=xml

      - name: Run setup verification
        # Runs unconditionally: a clean checkout must pass, reporting the
        # gitignored 1 GB checkpoint as a warning rather than an error.
        run: python verify_setup.py

      - name: Run live comparison
        if: steps.artifacts.outputs.present == 'true'
        run: python run_all.py

      - name: Security scan
        # Scoped to declared requirements so the result is reproducible on a
        # bare runner. A bare `pip_audit` audits the whole interpreter and
        # fails on unrelated preinstalled packages.
        run: python -m pip_audit --requirement requirements.txt

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: py${{ matrix.python-version }}-coverage
          fail_ci_if_error: false

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v7
        with:
          name: comparison-artifacts-py${{ matrix.python-version }}
          path: |
            slm-comparison/comparison_samples.json
            slm-comparison/comparison_samples.md
            benchmarks/slm_live_results.json
            benchmarks/qwen_base_results.json
            benchmarks/slm_forward_bench.json
            benchmarks/qwen_forward_bench.json
            benchmarks/benchmark_report.md
            benchmarks/test_split_eval.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Generate provenance manifest
        run: python scripts/generate_provenance.py --output provenance.json

      - name: Upload provenance manifest
        uses: actions/upload-artifact@v7
        with:
          name: provenance-py${{ matrix.python-version }}
          path: provenance.json
          retention-days: 30

  # The Dockerfile is part of the documented deploy path, so build it on every
  # push and pull request and assert the image actually serves.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` puts the image in the local daemon so the smoke test can
      # run it. The build context is trimmed by .dockerignore.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: slm-project:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Asserts what a clean checkout can assert: the image runs as the
      # non-root user, and the API answers /health without the gitignored
      # checkpoint (the model loads lazily on the first inference request).
      # No port is published -- the probe talks to the container over `exec`.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint id slm-project:ci
          docker run --rm -d --name slm-ci slm-project:ci
          for _ in $(seq 1 30); do
            if docker exec slm-ci python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Running}}' slm-ci 2>/dev/null)" != "true" ]; then
            echo "::error::Container slm-ci is not running" >&2
            docker logs slm-ci || true
            exit 1
          fi
          docker exec slm-ci python -c "import json, urllib.request; r = json.load(urllib.request.urlopen('http://localhost:8000/health')); print(r); assert r['status'] == 'ok' and r['model_loaded'] is False"
          docker stop slm-ci
