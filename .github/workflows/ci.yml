name: Benchmark and Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,qlora]"

      - name: Run ruff linter
        run: ruff check .

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=80 -m "not slow" --ignore=tests/test_model_and_api.py

      - name: Run API and model tests
        run: |
          python -m pytest tests/test_model_and_api.py -v --cov=. --cov-report=xml -m "not slow"

      - name: Run setup verification
        run: python verify_setup.py

      - name: Run live comparison
        run: python run_all.py

      - name: Security scan
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: py${{ matrix.python-version }}-coverage
          fail_ci_if_error: false

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-artifacts-py${{ matrix.python-version }}
          path: |
            slm-comparison/comparison_samples.json
            slm-comparison/comparison_samples.md
            benchmarks/slm_live_results.json
            benchmarks/qwen_base_results.json
            benchmarks/slm_forward_bench.json
            benchmarks/qwen_forward_bench.json
            benchmarks/benchmark_report.md
            benchmarks/test_split_eval.json
          retention-days: 30

      - name: Generate provenance manifest
        run: python scripts/generate_provenance.py --output provenance.json

      - name: Upload provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: provenance-py${{ matrix.python-version }}
          path: provenance.json
          retention-days: 30
