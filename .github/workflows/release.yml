name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # setuptools-scm parses the tag as the distribution version, so only
      # clean vX.Y.Z tags are releasable. Fail with a clear message otherwise
      # instead of letting the build die inside the version parser.
      - name: Validate tag format
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${tag}' is not a clean vX.Y.Z release tag." >&2
            echo "::error::Retag as v<major>.<minor>.<patch> (e.g. v1.2.3)." >&2
            exit 1
          fi
          echo "Releasing ${tag}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,qlora]"

      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow"

      - name: Generate provenance manifest
        run: python scripts/generate_provenance.py --output provenance.json

      # Plain `build` (no --wheel) produces the sdist first and then builds the
      # wheel from that sdist, so the released wheel is derived from the same
      # source archive that is published alongside it.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify wheel version matches tag
        shell: python
        run: |
          import glob
          import os
          import zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:]
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              meta = [n for n in z.namelist() if n.endswith("METADATA")][0]
              versions = [
                  line.split(":", 1)[1].strip()
                  for line in z.read(meta).decode().splitlines()
                  if line.startswith("Version:")
              ]
          assert versions == [expected], f"wheel version {versions} != tag {expected}"
          print(f"wheel {os.path.basename(wheels[0])} carries version {versions[0]}")

      - name: Generate changelog
        shell: bash
        run: |
          echo "## Changes" > RELEASE_NOTES.md
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --oneline "${prev}..HEAD" >> RELEASE_NOTES.md
          else
            git log --oneline -20 >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            provenance.json
            RELEASE_NOTES.md
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
