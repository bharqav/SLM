name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security or safety-pipeline vulnerabilities must NOT be reported here.**
        Use [GitHub Security Advisories](https://github.com/bharqav/emotional-slm/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: The chat endpoint returned a 500 when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands or requests that trigger the problem.
      placeholder: |
        1. `cp .env.example .env && docker compose up --build`
        2. `curl -X POST http://localhost:8000/api/v1/chat ...`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, deployment method.
      placeholder: |
        - OS: Windows 11 / macOS 15 / Ubuntu 24.04
        - Python: 3.12.1
        - Node: 20.x
        - Deploy: docker compose / local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant output. **Remove secrets, tokens, and conversation content first.**
      render: shell
