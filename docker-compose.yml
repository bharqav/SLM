version: '3.8'

services:
  slm-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./slm-training:/app/slm-training
      - ./slm-ft:/app/slm-ft
    command: python -m uvicorn slm_api:app --host 0.0.0.0 --port 8000
    environment:
      - SLM_CHECKPOINT=slm-training/best_model.pt
      - MODEL_DEVICE=cpu
    deploy:
      resources:
        limits:
          memory: 4G

  benchmark:
    build: .
    volumes:
      - ./slm-training:/app/slm-training
      - ./slm-ft:/app/slm-ft
      - ./slm-comparison:/app/slm-comparison
      - ./benchmarks:/app/benchmarks
    command: python run_all.py
    environment:
      - PYTHONUNBUFFERED=1
